<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="format-detection" content="telephone=no">
<title>Forge Mobile</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css?v=2">
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-mark"></div>
  <div class="splash-title">Forge&nbsp;Mobile</div>
  <div class="splash-status" id="splashStatus">Подключение к Forge…</div>
  <div class="splash-bar"><i></i></div>
</div>

<header class="appbar" id="appbar">
  <button class="appbar-btn" id="btnModel" aria-label="Модель">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
  </button>
  <div class="appbar-title">
    <b id="barTitle">txt2img</b>
    <span id="barSub">—</span>
  </div>
  <button class="appbar-btn" id="btnQueue" aria-label="Состояние">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <button class="appbar-btn" id="btnSettings" aria-label="Настройки">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.88-.34 1.7 1.7 0 00-1 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 008 19.4a1.7 1.7 0 00-1.88.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.56-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.88l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.56V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.56 1.7 1.7 0 001.88-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.56 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>
  </button>
</header>

<main id="views">
  <section class="view" id="view-txt2img"></section>
  <section class="view" id="view-img2img" hidden></section>
  <section class="view" id="view-extras" hidden></section>
  <section class="view" id="view-browser" hidden></section>
</main>

<div class="runbar" id="runbar" hidden>
  <div class="runbar-progress"><i id="runProgress"></i></div>
  <div class="runbar-body">
    <button class="btn-run" id="btnRun"><span>Генерация</span></button>
    <button class="btn-stop" id="btnStop" hidden aria-label="Прервать">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button class="btn-icon" id="btnSkip" hidden aria-label="Пропустить">
      <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
    </button>
  </div>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-tab="txt2img">
    <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 5v14M15 19H9"/></svg>
    <span>txt2img</span>
  </button>
  <button class="tab" data-tab="img2img">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 15l-5-5-9 9"/></svg>
    <span>img2img</span>
  </button>
  <button class="tab" data-tab="extras">
    <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
    <span>Extras</span>
  </button>
  <button class="tab" data-tab="browser">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5 4 4L15 11l6 5.5"/></svg>
    <span>Галерея</span>
  </button>
</nav>

<div class="sheet-root" id="sheetRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<div class="lightbox" id="lightbox" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
